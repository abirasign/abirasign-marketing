<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maintenance — AbiraSign</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #F8FAFC;
            color: #111827;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 60px;
            background: #ffffff;
            border-bottom: 1px solid #E5E7EB;
            display: flex;
            align-items: center;
            padding: 0 32px;
        }
        .nav-logo { font-size: 18px; font-weight: 600; color: #111827; }
        .nav-logo span { color: #0E7490; }
        .card {
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        .icon { font-size: 48px; margin-bottom: 1.25rem; }
        .title {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 0.5rem;
        }
        .sub {
            font-size: 15px;
            color: #6B7280;
            line-height: 1.65;
            margin-bottom: 2.5rem;
        }
        .pill {
            display: inline-block;
            background: #E0F2FE;
            color: #0E7490;
            border-radius: 9999px;
            padding: 6px 18px;
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="nav">
        <div class="nav-logo">Abira<span>Sign</span></div>
    </div>
    <div class="card">
        <div class="icon">🔧</div>
        <div class="title">We'll be right back</div>
        <div class="sub">AbiraSign is undergoing scheduled maintenance. We apologize for the interruption and will be back online shortly.</div>
        <span class="pill">Maintenance in progress</span>
    </div>
</body>
</html>
